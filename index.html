<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ituri Konnect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
    }
    .header {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #FFD700;
    }
    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .header p {
      opacity: 0.9;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    button {
      background: #FFD700;
      color: #1e3c72;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background: #FFC400; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #messages {
      height: 300px;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .msg {
      background: rgba(255,255,255,0.15);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .msg .user { font-weight: bold; color: #FFD700; font-size: 0.9em; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 16px;
      margin-bottom: 10px;
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.6); }
    #userInfo { display: none; }
    .status { text-align: center; padding: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌍 Ituri Konnect</h1>
    <p>Connecter la communauté d'Ituri</p>
  </div>

  <div class="container">
    <div class="card">
      <div id="status" class="status">Chargement...</div>
      
      <div id="loginDiv">
        <button id="loginBtn">Se connecter avec Google</button>
      </div>

      <div id="userInfo">
        <p>Bienvenue <span id="userName"></span> 👋</p>
        <button id="logoutBtn">Se déconnecter</button>
      </div>
    </div>

    <div class="card" id="chatCard" style="display:none;">
      <h3>💬 Chat Communautaire</h3>
      <div id="messages"></div>
      <textarea id="messageInput" placeholder="Écris ton message..." rows="3"></textarea>
      <button id="sendBtn">Envoyer</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_tjMqbLODx1lM5B1vE_POQaS1i-iK8mM",
      authDomain: "ituri-konnect.firebaseapp.com",
      projectId: "ituri-konnect",
      storageBucket: "ituri-konnect.appspot.com",
      messagingSenderId: "1092729090655",
      appId: "1:1092729090655:web:4c2a0b219b385b50803fbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const status = document.getElementById('status');
    const loginDiv = document.getElementById('loginDiv');
    const userInfo = document.getElementById('userInfo');
    const chatCard = document.getElementById('chatCard');
    const userName = document.getElementById('userName');
    const messagesDiv = document.getElementById('messages');

    // 1. DESIGN ✅ + 2. CONNEXION GOOGLE ✅
    document.getElementById('loginBtn').onclick = () => {
      signInWithPopup(auth, provider).catch(err => {
        status.innerHTML = 'Erreur connexion ❌<br>' + err.message;
      });
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        status.innerHTML = 'Connecté ✅';
        loginDiv.style.display = 'none';
        userInfo.style.display = 'block';
        chatCard.style.display = 'block';
        userName.textContent = user.displayName;
        loadMessages();
      } else {
        status.innerHTML = 'Déconnecté. Connecte-toi pour chatter.';
        loginDiv.style.display = 'block';
        userInfo.style.display = 'none';
        chatCard.style.display = 'none';
      }
    });

    // 3. BASE DE DONNÉES ✅ + 4. CHAT ✅
    document.getElementById('sendBtn').onclick = async () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const user = auth.currentUser;
      
      if (text && user) {
        await addDoc(collection(db, "messages"), {
          text: text,
          user: user.displayName,
          uid: user.uid,
          timestamp: serverTimestamp()
        });
        input.value = '';
      }
    };

    function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
      onSnapshot(q, (snapshot) => {
        messagesDiv.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = 'msg';
          div.innerHTML = `<div class="user">${data.user}</div><div>${data.text}</div>`;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }
  </script>
</body>
</html>
