<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ituri Konnect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #f5f5f5;
            margin: 0;
        }
        h1 { color: #2c5f2d; font-size: 28px; }
        #status { 
            margin-top: 20px; 
            font-weight: bold; 
            padding: 15px;
            border-radius: 8px;
            background: white;
        }
        .ok { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Ituri Konnect</h1>
    <p>Site hébergé sur GitHub Pages ✅</p>
    <div id="status">Connexion à Firebase...</div>

    <script type="module">
      // Import depuis CDN pour que ça marche direct
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
      
      // Ta config Firebase que tu viens de trouver
      const firebaseConfig = {
        apiKey: "AIzaSyCt45URjqGbJiWaSivR2WgkHf7gNhZsOBc",
        authDomain: "ituri-konnect.firebaseapp.com",
        projectId: "ituri-konnect",
        storageBucket: "ituri-konnect.firebasestorage.app",
        messagingSenderId: "371067100688",
        appId: "1:371067100688:web:507efe8b805c310d367495",
        measurementId: "G-CYHKRWVR60"
      };

      // Initialise Firebase
      try {
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        
        document.getElementById('status').textContent = 'Firebase connecté ✅';
        document.getElementById('status').className = 'ok';
      } catch (error) {
        document.getElementById('status').textContent = 'Erreur Firebase : ' + error.message;
        document.getElementById('status').className = 'error';
      }
    </script>
</body>
</html>
